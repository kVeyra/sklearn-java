plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
}

allprojects {
    group = 'org.sklearn'
    version = '0.1.0-SNAPSHOT'

    // Version alias for release jar naming
    ext.releaseVersion = '0.0.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava {
        options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-serial',
            '-Xlint:-processing'
        ]
        options.encoding = 'UTF-8'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }

    checkstyle {
        toolVersion = '10.21.3'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }
}

// --- Release artifact tasks ---

def releaseVersion = ext.releaseVersion

task fatJar(type: Jar) {
    dependsOn subprojects.jar
    archiveFileName = "sklearn-java-${releaseVersion}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from subprojects.collect { p ->
        p.sourceSets.main.output
    }

    manifest {
        attributes(
            'Implementation-Title': 'sklearn-java',
            'Implementation-Version': releaseVersion,
            'Built-By': System.properties['user.name']
        )
    }
}

task moduleJars(type: Copy) {
    dependsOn subprojects.jar
    into "${buildDir}/libs/sklearn-java-${releaseVersion}/lib"
    from subprojects.collect { p ->
        "${p.buildDir}/libs/${p.name}-0.1.0-SNAPSHOT.jar"
    }
    rename { String fileName ->
        fileName.replace('-0.1.0-SNAPSHOT', "-${releaseVersion}")
    }
}

task releaseZip(type: Zip) {
    dependsOn moduleJars
    archiveFileName = "sklearn-java-${releaseVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir("libs")
    from "${buildDir}/libs/sklearn-java-${releaseVersion}"
    into "sklearn-java-${releaseVersion}"
}

task releasePrep {
    dependsOn fatJar
    dependsOn releaseZip
}
